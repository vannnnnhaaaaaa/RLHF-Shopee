<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ quy trình thông quan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .grid-container {
            display: grid;
            /* Thu nhỏ chiều rộng ô xuống 150px, giữ mũi tên 60px */
            grid-template-columns: 140px 60px 150px 60px 150px;
            /* Thu nhỏ chiều cao ô xuống 70px */
            grid-template-rows: 70px 60px 70px;
            align-items: center;
            justify-items: center;
        }

        .box {
            width: 100%;
            height: 100%;
            border: 2px solid #2d3748;
            border-radius: 8px; /* Giảm độ bo góc một chút cho phù hợp ô nhỏ */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #ffffff;
            padding: 5px 10px; /* Ép khoảng trắng nhỏ lại */
            box-sizing: border-box;
            font-weight: 600;
            font-size: 15px; /* Giảm font size một xíu để fit hoàn hảo */
            line-height: 1.3; /* Rút gọn khoảng cách giữa 2 dòng */
            color: #1a202c;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .arrow {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .arrow svg {
            width: 38px; /* Chỉnh mũi tên hơi nhỏ lại để cân đối với ô mới */
            height: 38px;
            fill: #718096; 
        }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="box">Chuẩn bị hồ sơ</div>
    <div class="arrow">
        <svg viewBox="0 0 24 24"><path d="M4 10h11v-4l7 6-7 6v-4h-11z"/></svg>
    </div>
    <div class="box">Khai tờ khai</div>
    <div class="arrow">
        <svg viewBox="0 0 24 24"><path d="M4 10h11v-4l7 6-7 6v-4h-11z"/></svg>
    </div>
    <div class="box">Đăng ký &<br>phân luồng</div>

    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div class="arrow">
        <svg viewBox="0 0 24 24"><path d="M10 4v11h-4l6 7 6-7h-4v-11z"/></svg>
    </div>

    <div class="box">Lưu hồ sơ</div>
    <div class="arrow">
        <svg viewBox="0 0 24 24"><path d="M20 10h-11v-4l-7 6 7 6v-4h11z"/></svg>
    </div>
    <div class="box">Thông quan</div>
    <div class="arrow">
        <svg viewBox="0 0 24 24"><path d="M20 10h-11v-4l-7 6 7 6v-4h11z"/></svg>
    </div>
    <div class="box">Kiểm tra<br>hồ sơ/hàng</div>
</div>

</body>
</html>
